pki/org-ca:
  type: pki
  roles:
    web:
      server_flag: true
      client_flag: false
      ttl: 600
      organization: [E2E Org]
      country: [GR]
      locality: [Athens]
      allowed_domains: [example.test, dev.example.test]
      allow_glob_domains: true
      key_usage: [DigitalSignature, KeyEncipherment]
      access:
        static: &all_test_principals
          - ldap.users.e2e-user
          - ldap.groups.e2e-group
          - identity.entity_name.e2e-entity
          - identity.group_name.e2e-identity-group
          - cert.e2e.example.test
          - kubernetes.default.e2e-serviceaccount
    client-generate:
      client_flag: true
      server_flag: false
      ttl: 1200
      organization: [E2E Org]
      country: [GR]
      locality: [Athens]
      templated_common_name: [email]
      key_usage: [DigitalSignature, KeyEncipherment]
      access:
        static:
          - ldap.groups.e2e-pki-clients

staging/cluster01:
  type: kubernetes
  roles:
    admin:
      namespaces: ["*"]
      ttl: 600
      ttl_max: 3600
      access:
        static: *all_test_principals
    deployer:
      namespaces: [application, stress-test1, playground]
      ttl: 600
      ttl_max: 3600
      access:
        static:
          - ldap.groups.e2e-developers
    bot-deploy:
      namespaces: [application]
      ttl: 600
      ttl_max: 1800
      access:
        static:
          - ldap.users.e2e-cicd

staging/vms:
  type: ssh
  roles:
    developer:
      ttl: 60
      ttl_max: 600
      extensions: [permit-pty]
      access:
        static: *all_test_principals
    admin:
      ttl: 120
      ttl_max: 1200
      extensions:
        - permit-pty
        - permit-port-forwarding
        - permit-agent-forwarding
        - permit-user-rc
        - permit-X11-forwarding
      access:
        static:
          - ldap.groups.e2e-admins

adhoc:
  type: vault
  roles:
    secrets-personal:
      access:
        static: *all_test_principals
    secrets-group:
      for_each: true
      access:
        static:
          - ldap.groups.e2e-group
          - ldap.groups.e2e-admins
