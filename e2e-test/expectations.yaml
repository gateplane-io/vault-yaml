#
# Commands run through the Vault/OpenBao CLI inside the server pod.
# Assertions use dot-separated paths into each command's JSON output.

expectations:
  - name: PKI mount exists
    command: [read, -format=json, sys/mounts/pki/org-ca]
    assertions:
      data.type: pki

  - name: Kubernetes secrets mount exists
    command: [read, -format=json, sys/mounts/staging/cluster01]
    assertions:
      data.type: kubernetes

  - name: SSH mount exists
    command: [read, -format=json, sys/mounts/staging/vms]
    assertions:
      data.type: ssh

  - name: PKI role was generated
    command: [read, -format=json, pki/org-ca/roles/web]
    assertions:
      data.client_flag: false
      data.server_flag: true
      data.allow_bare_domains: false

  - name: Kubernetes secrets role was generated
    command: [read, -format=json, staging/cluster01/roles/admin]
    assertions:
      data.kubernetes_role_type: ClusterRole
      data.token_default_ttl: 600
      data.token_max_ttl: 3600

  - name: SSH role was generated
    command: [read, -format=json, staging/vms/roles/developer]
    assertions:
      data.key_type: ca
      data.allow_user_certificates: true
      data.ttl: 60
      data.max_ttl: 600

  - name: PKI policy exists
    command: [read, -format=json, sys/policies/acl/pki-web-org-ca]
    assertions:
      data.name: pki-web-org-ca

  - name: Kubernetes policy exists
    command: [read, -format=json, sys/policies/acl/kubernetes-admin-cluster01]
    assertions:
      data.name: kubernetes-admin-cluster01

  - name: SSH policy exists
    command: [read, -format=json, sys/policies/acl/ssh-developer-vms]
    assertions:
      data.name: ssh-developer-vms

  - name: Ad-hoc policy exists
    command: [read, -format=json, sys/policies/acl/vault-secrets-personal-adhoc]
    assertions:
      data.name: vault-secrets-personal-adhoc

  - name: LDAP user policies were attached
    command: [read, -format=json, auth/ldap/users/e2e-user]
    assertions:
      data.policies: [kubernetes-admin-cluster01, pki-web-org-ca, ssh-developer-vms, vault-secrets-personal-adhoc]

  - name: LDAP group policies were attached
    command: [read, -format=json, auth/ldap/groups/e2e-group]
    assertions:
      data.policies: [kubernetes-admin-cluster01, pki-web-org-ca, ssh-developer-vms, vault-secrets-personal-adhoc]

  - name: Identity entity policies were attached
    command: [read, -format=json, identity/entity/name/e2e-entity]
    assertions:
      data.name: e2e-entity
      data.policies: [kubernetes-admin-cluster01, pki-web-org-ca, ssh-developer-vms, vault-secrets-personal-adhoc]

  - name: Identity group policies were attached
    command: [read, -format=json, identity/group/name/e2e-identity-group]
    assertions:
      data.name: e2e-identity-group
      data.policies: [kubernetes-admin-cluster01, pki-web-org-ca, ssh-developer-vms, vault-secrets-personal-adhoc]

  - name: Certificate auth role was generated
    command: [read, -format=json, auth/cert/certs/e2e.example.test]
    assertions:
      data.display_name: e2e.example.test
      data.token_policies: [kubernetes-admin-cluster01, pki-web-org-ca, ssh-developer-vms, vault-secrets-personal-adhoc]

  - name: Kubernetes auth role was generated
    command: [read, -format=json, auth/kubernetes/role/default-e2e-serviceaccount]
    assertions:
      data.bound_service_account_names: [e2e-serviceaccount]
      data.bound_service_account_namespaces: [default]
      data.token_policies: [kubernetes-admin-cluster01, pki-web-org-ca, ssh-developer-vms, vault-secrets-personal-adhoc]
